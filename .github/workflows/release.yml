name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: debian12,    image: 'debian:12',        kind: deb }
          - { label: ubuntu24.04, image: 'ubuntu:24.04',     kind: deb }
          - { label: fedora43,    image: 'fedora:43',        kind: rpm }
          - { label: archlinux,   image: 'archlinux:latest', kind: arch }
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sh packaging/ci-deps.sh ${{ matrix.kind }}

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0+git${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build package
        shell: bash
        run: bash packaging/build.sh ${{ matrix.kind }} ${{ matrix.label }} "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.label }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
